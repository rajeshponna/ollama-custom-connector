# Configuration for running connectors locally in bundle with connector-runtime
server.port=9898
#camunda.client.grpc-address=http://localhost:26500
#camunda.client.rest-address=http://localhost:8080


# Switch from managed to remote runtime
camunda.process-test.runtime-mode=remote

# Remote runtime connection
camunda.process-test.remote.camunda-monitoring-api-address=http://localhost:9600
camunda.process-test.remote.connectors-rest-api-address=http://localhost:8086

# Client connection
camunda.client.rest-address=http://localhost:8080
camunda.client.grpc-address=http://localhost:26500

